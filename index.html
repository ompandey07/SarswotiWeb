<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #0b0d10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .image-wrapper {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    @media (max-aspect-ratio: 1/1) {
      .image-wrapper img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <div class="image-wrapper">
    <img src="ChatGPT Image Aug 28, 2026, 06_02_17 PM.png" alt="Responsive Fullscreen Image">
  </div>
</body>
</html>
